version: 2

models:
  - name: dim_customers
    description: >
      One row per customer_id.
      Row count equals unique row count from stg_customers
      Sourced directly from stg_customers with no transformation.
            
    columns:
      - name: customer_id
        description: unique identifier for customer
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: customer's first name
        data_tests:
          - not_null
      - name: last_name
        description: customer's last name
        data_tests:
          - not_null



select customer_id, first_name, last_name 
from {{ref('stg_customers')}}

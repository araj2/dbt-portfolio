version: 2

models:
  - name: dim_customers
    description: >
      One row per customer_id.
      Row count equals unique row count from stg_customers
      Sourced directly from stg_customers with no transformation.
            
    columns:
      - name: customer_id
        description: unique identifier for customer
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: first name of the customer who placed the order
        data_tests:
          - not_null
      - name: last_name
        description: last name of the customer who placed the order
        data_tests:
          - not_null




